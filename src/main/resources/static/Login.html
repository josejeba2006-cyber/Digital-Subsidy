<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Digital Subsidy</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>

<body class="auth-page">

<header class="navbar">

    <div class="logo">
        Digital<span>Subsidy</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#schemes">Schemes</a>
        <a href="index.html#how-it-works">How It Works</a>
    </nav>

    <div class="nav-buttons">
        <a href="register.html" class="btn register-btn">
            Register
        </a>
    </div>

</header>


<main class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🔐
            </div>

            <p class="auth-tag">WELCOME BACK</p>

            <h1>Login to your account</h1>

            <p>
                Access your subsidy applications and track their status.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                >

            </div>
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                    >

                    <button type="button" id="togglePassword">
                        👁
                    </button>

                </div>

            </div>


            <div id="loginMessage" class="message"></div>


            <button type="submit" class="auth-submit">
                Login
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </div>

    </div>

</main>


<footer class="auth-footer-bottom">

    <div class="footer-logo">
        Digital<span>Subsidy</span>
    </div>

    <p>
        Simple, transparent and accessible subsidy applications.
    </p>

</footer>


<script src="js/auth.js"></script>

</body>
</html>
