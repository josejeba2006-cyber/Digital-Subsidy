<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Schemes - Digital Subsidy</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        /* ================= HEADER ================= */

        .scheme-management-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }


        .add-scheme-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            background: #2563eb;
            color: white;
        }

        .add-scheme-btn:hover {
            background: #1d4ed8;
        }


        /* ================= FORM ================= */

        .scheme-form-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            margin-bottom: 25px;
            display: none;
        }

        .scheme-form-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }


        .scheme-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 15px;
            font-family: inherit;

            background: #ffffff;

            box-sizing: border-box;

        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            outline: none;
            border-color: #2563eb;

        }


        .form-group textarea {
            resize: vertical;
        }


        .full-width {
            grid-column: 1 / -1;
        }


        /* ================= FORM BUTTONS ================= */

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }


        .cancel-btn {

            padding: 12px 20px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            background: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

        }


        .cancel-btn:hover {
            background: #f8fafc;
        }


        /* ================= TABLE ================= */

        .scheme-table-container {

            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            overflow-x: auto;

        }


        .scheme-table {

            width: 100%;
            border-collapse: collapse;

        }


        .scheme-table th,
        .scheme-table td {

            padding: 15px;
            text-align: left;

            border-bottom:
                    1px solid #e5e7eb;

        }


        .scheme-table th {

            font-size: 13px;
            color: #64748b;
            font-weight: 600;

        }


        .scheme-table td {
            font-size: 14px;
        }


        /* ================= STATUS ================= */

        .scheme-status {

            padding: 6px 12px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: 600;

        }


        .scheme-status.active {

            background: #dcfce7;
            color: #166534;

        }


        .scheme-status.inactive {

            background: #fee2e2;
            color: #991b1b;

        }


        /* ================= ACTION BUTTONS ================= */

        .table-action-btn {

            border: none;

            padding: 8px 12px;
            border-radius: 6px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 600;

            margin-right: 5px;

        }


        .edit-btn {

            background: #dbeafe;
            color: #1d4ed8;

        }


        .delete-btn {

            background: #fee2e2;
            color: #dc2626;

        }


        /* ================= MOBILE ================= */

        @media(max-width: 700px) {

            .scheme-management-header {

                flex-direction: column;
                align-items: flex-start;

            }


            .scheme-form-grid {

                grid-template-columns: 1fr;

            }


            .full-width {

                grid-column: auto;

            }

        }
        .scheme-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            border: none;
            border-radius: 7px;
            padding: 8px 13px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .edit-scheme-btn {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
        }

        .edit-scheme-btn:hover {
            background: #dbeafe;
        }

        .delete-scheme-btn {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .delete-scheme-btn:hover {
            background: #fee2e2;
        }
        .navbar nav a.active {
            color: #2563eb;

            background: #eff6ff;

            font-weight: 700;
        }

    </style>

</head>


<body class="dashboard-page">


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">

        Digital<span>Subsidy</span>

    </div>


    <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-schemes.html" class="active">Schemes</a>
        <a href="admin-users.html">Users</a>
        <a href="admin-applications.html">Applications</a>
        <a href="officer-bank-details.html"> Bank Details</a>
        <a href="admin-payments.html"> Payments</a>
        <a href="admin-regional-allocation.html">Regional Allocation</a>
    </nav>


    <!-- PROFILE -->

    <div class="profile-menu">

        <button class="profile-button"
                id="profileButton">

            <span>
                👤
            </span>


            <span id="staffEmail">

                Admin

            </span>


            <span>
                ▼
            </span>

        </button>


        <div class="profile-dropdown"
             id="profileDropdown">


            <div class="dropdown-user">


                <div class="dropdown-avatar">

                    👤

                </div>


                <div>

                    <strong id="dropdownStaffEmail">

                        Admin

                    </strong>


                    <small>

                        Administrator

                    </small>

                </div>


            </div>


            <div class="dropdown-divider">

            </div>


            <button id="logoutBtn">

                🚪 Logout

            </button>


        </div>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="profile-container">


    <!-- PAGE HEADER -->

    <div class="scheme-management-header">


        <div>


            <p class="hero-tag">

                ADMIN PORTAL

            </p>


            <h1>

                Manage Schemes

            </h1>


            <p>

                Create, edit and manage subsidy schemes.

            </p>


        </div>


        <button
                type="button"
                class="add-scheme-btn"
                id="showFormBtn">

            + Add Scheme

        </button>


    </div>



    <!-- ================= ADD / EDIT FORM ================= -->

    <div class="scheme-form-card"
         id="schemeFormCard">


        <h2 id="formTitle">

            Add New Scheme

        </h2>


        <!-- IMPORTANT: scheme-form-grid ADDED -->

        <form id="schemeForm"
              class="scheme-form-grid">
            <input
                    type="hidden"
                    id="status"
                    value="ACTIVE">


            <!-- SCHEME NAME -->

            <div class="form-group">

                <label for="schemeName">

                    Scheme Name

                </label>

                <input
                        type="text"
                        id="schemeName"
                        required>

            </div>
            <div class="form-group">

                <label>Eligible Gender</label>

                <select id="eligibleGender">

                    <option value="ALL">
                        All Genders
                    </option>

                    <option value="MALE">
                        Male
                    </option>

                    <option value="FEMALE">
                        Female
                    </option>

                    <option value="OTHER">
                        Other
                    </option>

                </select>

            </div>



            <!-- MAX AMOUNT -->

            <div class="form-group full-width">

                <label style="
        display:block;
        font-size:16px;
        font-weight:600;
        color:#163a63;
        margin-bottom:12px;
    ">
                    Grant Amount Slabs
                </label>

                <div id="slabContainer">

                    <div class="slab-row" style="
            display:grid;
            grid-template-columns:1fr 1fr 1fr 1fr auto;
            gap:12px;
            align-items:center;
            padding:16px;
            margin-bottom:12px;
            background:#f8fafc;
            border:1px solid #dbe3ec;
            border-radius:10px;
        ">

                        <!-- Minimum Income -->
                        <!-- Minimum Income -->
                        <select name="minimumIncome" required style="
                                width:100%;
                                padding:12px 14px;
                                border:1px solid #cbd5e1;
                                border-radius:8px;
                                background:white;
                                font-size:14px;
                                color:#334155;
                                outline:none;
                            ">
                            <option value="">Min Income</option>

                            <option value="0">₹0</option>

                            <option value="100001">₹1,00,001</option>

                            <option value="200001">₹2,00,001</option>

                            <option value="300001">₹3,00,001</option>

                            <option value="400001">₹4,00,001</option>

                            <option value="500001">₹5,00,001</option>

                            <option value="600001">₹6,00,001</option>

                            <option value="700001">₹7,00,001</option>
                        </select>

                        <!-- Maximum Income -->
                        <select name="maximumIncome" required style="
                width:100%;
                padding:12px 14px;
                border:1px solid #cbd5e1;
                border-radius:8px;
                background:white;
                font-size:14px;
                color:#334155;
                outline:none;
            ">
                            <option value="">Max Income</option>
                            <option value="100000">₹1,00,000</option>
                            <option value="200000">₹2,00,000</option>
                            <option value="300000">₹3,00,000</option>
                            <option value="400000">₹4,00,000</option>
                            <option value="500000">₹5,00,000</option>
                            <option value="700000">₹7,00,000</option>
                            <option value="1000000">₹10,00,000</option>
                        </select>




                        <!-- Grant Amount -->
                        <select name="grantAmount" required style="
    width:100%;
    padding:12px 14px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    background:white;
    font-size:14px;
    color:#334155;
    outline:none;
">
                            <option value="">Grant Amount</option>

                            <option value="20000">₹20,000</option>

                            <option value="30000">₹30,000</option>

                            <option value="50000">₹50,000</option>

                            <option value="75000">₹75,000</option>

                            <option value="100000">₹1,00,000</option>
                            <option value="200000">₹2,00,000</option>

                        </select>

                        <!-- Remove -->
                        <button
                                type="button"
                                onclick="removeSlab(this)"
                                style="
                    padding:10px 14px;
                    border:1px solid #fecaca;
                    border-radius:8px;
                    background:#fff1f2;
                    color:#dc2626;
                    font-size:13px;
                    font-weight:600;
                    cursor:pointer;
                ">
                            Remove
                        </button>

                    </div>

                </div>

                <button
                        type="button"
                        onclick="addSlab()"
                        style="
            width:100%;
            padding:12px;
            border:1px dashed #94a3b8;
            border-radius:8px;
            background:#f8fafc;
            color:#163a63;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
        ">
                    + Add Grant Slab
                </button>

            </div>



            <!-- MIN AGE -->

            <div class="form-group">

                <label for="minimumAge">

                    Minimum Age

                </label>

                <input
                        type="number"
                        id="minimumAge"
                        min="0"
                        required>

            </div>



            <!-- MAX AGE -->

            <div class="form-group">

                <label for="maximumAge">

                    Maximum Age

                </label>

                <input
                        type="number"
                        id="maximumAge"
                        min="0"
                        required>

            </div>
            <div class="form-group">

                <label>Beneficiary Category</label>

                <div id="beneficiaryCategoryGroup"
                     style="
            display:flex;
            flex-wrap:wrap;
            gap:12px;
            padding:10px 0;
         ">

                    <label>
                        <input type="checkbox"
                               name="beneficiaryCategory"
                               value="ALL">
                        ALL
                    </label>
                    <label>
                        <input type="checkbox"
                               name="beneficiaryCategory"
                               value="BC">
                        BC
                    </label>
                    <label>
                        <input type="checkbox"
                               name="beneficiaryCategory"
                               value="MBC">
                        MBC
                    </label>

                    <label>
                        <input type="checkbox"
                               name="beneficiaryCategory"
                               value="SC">
                        SC
                    </label>

                    <label>
                        <input type="checkbox"
                               name="beneficiaryCategory"
                               value="ST">
                        ST
                    </label>

                </div>

            </div>


            <div class="form-group">
                <label for="eligibleLocation">
                    Eligible Location
                </label>

                <select id="eligibleLocation">
                    <option value="ALL">ALL</option>
                        <option>Andhra Pradesh</option>
                        <option>Arunachal Pradesh</option>
                        <option>Assam</option>
                        <option>Bihar</option>
                        <option>Chhattisgarh</option>
                        <option>Goa</option>
                        <option>Gujarat</option>
                        <option>Haryana</option>
                        <option>Himachal Pradesh</option>
                        <option>Jharkhand</option>
                        <option>Karnataka</option>
                        <option>Kerala</option>
                        <option>Madhya Pradesh</option>
                        <option>Maharashtra</option>
                        <option>Manipur</option>
                        <option>Meghalaya</option>
                        <option>Mizoram</option>
                        <option>Nagaland</option>
                        <option>Odisha</option>
                        <option>Punjab</option>
                        <option>Rajasthan</option>
                        <option>Sikkim</option>
                        <option>Tamil Nadu</option>
                        <option>Telangana</option>
                        <option>Tripura</option>
                        <option>Uttar Pradesh</option>
                        <option>Uttarakhand</option>
                        <option>West Bengal</option>


                </select>
            </div>

            <!-- OCCUPATION -->

            <div class="form-group">

                <label for="eligibleOccupation">
                    Occupation
                </label>

                <select id="eligibleOccupation" required>
                    <option value="">Select occupation</option>
                    <option value="Student">Student</option>
                    <option value="Employee">Employee</option>
                    <option value="Farmer">Farmer</option>
                    <option value="Entrepreneur">Entrepreneur</option>
                    <option value="Fisherman">Fisherman</option>
                    <option value="Worker">Worker</option>
                    <option value="Senior Citizen">Senior Citizen</option>
                    <option value="Housewife">House Wife</option>
                    <option value="MINORITY">Minority</option>
                    <option value="DISABLED">Disabled</option>
                </select>

            </div>


            <!-- START DATE -->

            <div class="form-group">

                <label for="startDate">

                    Start Date

                </label>

                <input
                        type="date"
                        id="startDate"
                        required>

            </div>



            <!-- END DATE -->

            <div class="form-group">

                <label for="endDate">

                    End Date

                </label>

                <input
                        type="date"
                        id="endDate"
                        required>

            </div>


            <div class="form-group full-width">

                <label for="benefits">
                    Scheme Benefits
                </label>

                <textarea
                        id="benefits"
                        rows="5"
                        placeholder="Enter scheme benefits..."
                        required>
                </textarea>

            </div>
            <!-- DESCRIPTION -->

            <div class="form-group full-width">

                <label for="description">

                    Scheme Description

                </label>

                <textarea
                        id="description"
                        rows="4">

                </textarea>

            </div>



            <!-- REQUIRED DOCUMENTS -->

            <div class="form-group full-width">

                <label for="requiredDocuments">

                    Required Documents

                </label>

                <textarea
                        id="requiredDocuments"
                        rows="3"
                        placeholder="Example: Aadhaar Card, Income Certificate">

                </textarea>

            </div>



            <!-- BUTTONS -->

            <div class="full-width form-actions">


                <button
                        type="submit"
                        class="add-scheme-btn"
                        id="saveSchemeBtn">

                    Save Scheme

                </button>


                <!-- THIS ID FIXES YOUR NULL ERROR -->

                <button
                        type="button"
                        class="cancel-btn"
                        id="cancelFormBtn">

                    Cancel

                </button>


            </div>


        </form>

    </div>



    <!-- ================= SCHEME TABLE ================= -->

    <div class="scheme-table-container">


        <table class="scheme-table">


            <thead>


            <tr>

                <th>ID</th>

                <th>Scheme Name</th>

                <th>Age Limit</th>

                <th>Status</th>

                <th>Actions</th>

            </tr>


            </thead>



            <tbody id="schemesTableBody">


            <tr>

                <td colspan="6">

                    Loading schemes...

                </td>

            </tr>


            </tbody>


        </table>


    </div>


</main>



<!-- ================= JAVASCRIPT ================= -->

<script src="js/admin-schemes.js"></script>

</body>

</html>
