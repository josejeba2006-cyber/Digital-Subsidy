<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Users - Digital Subsidy</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        .users-header {
            margin-bottom: 30px;
        }

        .users-table-container {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th,
        .users-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .users-table th {
            font-size: 13px;
            color: #64748b;
            background: #f8fafc;
        }

        .users-table td {
            font-size: 14px;
        }

        .user-name {
            font-weight: 600;
            color: #1e293b;
        }

        .action-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 6px;
            font-size: 13px;
        }

        .edit-user-btn {
            background: #eff6ff;
            color: #2563eb;
        }

        .delete-user-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .empty-users {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        @media (max-width: 700px) {

            .users-table th,
            .users-table td {
                padding: 10px;
            }

        }
        .user-form-card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .user-form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .user-form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        @media (max-width: 700px) {

            .user-form-grid {
                grid-template-columns: 1fr;
            }

        }
        .navbar nav a.active {
            color: #2563eb;

            background: #eff6ff;

            font-weight: 700;
        }

    </style>

</head>


<body class="dashboard-page">


<header class="navbar">

    <div class="logo">
        Digital<span>Subsidy</span>
    </div>


    <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-schemes.html">Schemes</a>
        <a href="admin-users.html" class="active">Users</a>
        <a href="admin-applications.html">Applications</a>
        <a href="officer-bank-details.html"> Bank Details</a>
        <a href="admin-payments.html"> Payments</a>
        <a href="admin-regional-allocation.html">Regional Allocation</a>

    </nav>


    <div class="profile-menu">

        <button
                class="profile-button"
                id="profileButton">

            <span>👤</span>

            <span id="staffEmail">
                Admin
            </span>

            <span>▼</span>

        </button>


        <div
                class="profile-dropdown"
                id="profileDropdown">

            <div class="dropdown-user">

                <div class="dropdown-avatar">
                    👤
                </div>

                <div>

                    <strong id="dropdownStaffEmail">
                        Admin
                    </strong>

                    <small>
                        Administrator
                    </small>

                </div>

            </div>


            <div class="dropdown-divider"></div>


            <button id="logoutBtn">
                🚪 Logout
            </button>

        </div>

    </div>

</header>


<main class="profile-container">


    <div class="users-header">

        <p class="hero-tag">
            ADMIN PORTAL
        </p>

        <h1>
            Manage Users
        </h1>

        <p>
            View and manage registered users.
        </p>

    </div>
    <div class="user-form-card"
         id="userFormCard"
         style="display: none;">

        <h2>Edit User</h2>

        <form id="userForm">

            <div class="user-form-grid">

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text"
                           id="firstName"
                           required>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text"
                           id="lastName">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           id="emailId"
                           required>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text"
                           id="phone">
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <select id="gender">
                        <option value="">Select Gender</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date"
                           id="dateofbirth">
                </div>

                <div class="form-group">
                    <label>Annual Income</label>
                    <input type="number"
                           id="annualIncome">
                </div>

                <div class="form-group">
                    <label>Occupation</label>
                    <input type="text"
                           id="occupation">
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text"
                           id="location">
                </div>

            </div>

            <div class="user-form-actions">

                <button type="submit"
                        class="action-btn edit-user-btn">

                    Update User

                </button>

                <button type="button"
                        class="action-btn"
                        id="cancelEditBtn">

                    Cancel

                </button>

            </div>

        </form>

    </div>

    <div class="users-table-container">

        <table class="users-table">

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Phone</th>

                <th>Gender</th>

                <th>Occupation</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody id="usersTableBody">

            <tr>

                <td colspan="7"
                    class="empty-users">

                    Loading users...

                </td>

            </tr>

            </tbody>

        </table>

    </div>


</main>


<script src="js/admin-users.js"></script>
<script src="js/admin-dashboard.js"></script>

</body>

</html>
