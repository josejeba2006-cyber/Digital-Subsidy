<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Details - Digital Subsidy</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .bank-details-btn {
            display: inline-block;
            padding: 10px 18px;
            background: #1765b0;
            color: #ffffff;
            text-decoration: none;
            border-radius: 7px;
            font-weight: 600;
            white-space: nowrap;
        }

        .bank-details-btn:hover {
            background: #125596;
        }
        .proof-file-input {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            font-size: 14px;
        }
        .details-container {
            max-width: 1000px;
            margin: 40px auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .details-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
        }

        .details-header h2 {
            margin: 5px 0 0;
        }

        .status-badge,
        .installment-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-approved,
        .status-verified,
        .status-completed,
        .status-paid {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-pending,
        .status-submitted,
        .status-compliance-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-disbursed {
            background: #cffafe;
            color: #0e7490;
        }

        .status-available {
            background: #dcfce7;
            color: #166534;
        }

        .status-locked {
            background: #f1f5f9;
            color: #64748b;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .info-item {
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .info-item small {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .info-item strong {
            font-size: 15px;
        }

        .section-title {
            margin: 0 0 18px;
            color: #12395b;
        }

        .document-row,
        .installment-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
        }

        .document-name,
        .installment-name {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .document-name small,
        .installment-name small {
            color: #64748b;
        }

        .view-pdf-btn {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
        }

        .grant-box {
            padding: 18px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
        }

        .grant-box small {
            display: block;
            color: #166534;
            margin-bottom: 5px;
        }

        .grant-box strong {
            color: #166534;
            font-size: 22px;
        }

        .proof-box {
            margin-top: 12px;
            padding: 16px;
            background: #fffaf0;
            border: 1px solid #f0dfb0;
            border-radius: 8px;
        }

        .proof-box.verified {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .proof-box.rejected {
            background: #fef2f2;
            border-color: #fecaca;
        }

        .proof-button {
            margin-top: 12px;
            padding: 10px 17px;
            border: none;
            border-radius: 7px;
            background: #1765b0;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .proof-button:hover {
            background: #125596;
        }

        .empty-message {
            color: #64748b;
        }

        @media (max-width: 700px) {
            .details-container {
                margin: 25px 15px;
            }

            .details-header {
                flex-direction: column;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .document-row,
            .installment-row {
                align-items: flex-start;
                flex-direction: column;
            }
        }
        .verification-instruction {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .verification-instruction h3 {
            margin: 0 0 6px;
            color: #1e3a8a;
            font-size: 18px;
        }

        .verification-instruction p {
            margin: 0;
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
        }
        .workflow-box {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .workflow-box h3 {
            margin: 0 0 15px;
            color: #12395b;
        }

        .workflow-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .workflow-row:last-child {
            border-bottom: none;
        }

        .workflow-row > span:first-child {
            font-weight: 600;
            color: #334155;
        }

        .workflow-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #f8fafc;
        }

        .workflow-message.rejected {
            background: #fef2f2;
            color: #991b1b;
        }

        .workflow-message.reverification {
            background: #fffaf0;
            color: #92400e;
        }
        .navbar nav a.active {
            color: #2563eb;

            background: #eff6ff;

            font-weight: 700;
        }
    </style>
</head>

<body class="dashboard-page">

<header class="navbar">

    <div class="logo">
        Digital<span>Subsidy</span>
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="schemes.html">Schemes</a>
        <a href="eligible-schemes.html">Eligible Schemes</a>
        <a href="my-applications.html" class="active">My Applications</a>
        <a href="analytics.html">Analytics</a>
    </nav>

    <div class="profile-menu">
        <button class="profile-button" id="profileButton">
            <span class="user-icon">👤</span>
            <span id="navUserEmail">User</span>
            <span class="dropdown-arrow">▼</span>
        </button>

        <div class="profile-dropdown" id="profileDropdown">

            <div class="dropdown-user">
                <div class="dropdown-avatar">👤</div>

                <div>
                    <strong id="dropdownEmail">User</strong>
                    <small>User</small>
                </div>
            </div>

            <div class="dropdown-divider"></div>

            <a href="profile.html">👤 My Profile</a>

            <button id="logoutBtn">🚪 Logout</button>

        </div>
    </div>

</header>


<main class="details-container">

    <a href="my-applications.html" class="back-link">
        ← Back to My Applications
    </a>

    <div id="applicationDetails">

        <div class="empty-state">
            <div>📋</div>
            <h3>Loading application...</h3>
        </div>

    </div>

</main>


<footer>

    <div class="footer-logo">
        Digital<span>Subsidy</span>
    </div>

    <p>
        Simple, transparent and accessible subsidy applications.
    </p>

    <div class="footer-line"></div>

    <small>
        © 2026 Digital Subsidy Platform.
        All rights reserved.
    </small>

</footer>


<script src="js/application-details.js?v=1"></script>
<script src="js/navbar.js"></script>

</body>
</html>
