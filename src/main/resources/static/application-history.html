<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        Application History - Digital Subsidy
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                    Arial,
                    sans-serif;

            background:
                    #f5f7fb;

            color:
                    #1f2937;

        }


        /* ================= PAGE ================= */

        .page-container {

            max-width: 1400px;

            margin:
                    40px auto;

            padding:
                    0 30px;

        }


        /* ================= HEADER ================= */

        .page-header {

            display: flex;

            justify-content:
                    space-between;

            align-items:
                    center;

            margin-bottom:
                    30px;

        }


        .page-header h1 {

            margin: 0;

            font-size:
                    32px;

            color:
                    #1e293b;

        }


        .page-header p {

            margin-top:
                    8px;

            color:
                    #64748b;

        }


        .back-btn {

            border:
                    1px solid #2563eb;

            background:
                    white;

            color:
                    #2563eb;

            padding:
                    10px 18px;

            border-radius:
                    8px;

            cursor:
                    pointer;

            font-size:
                    14px;

            font-weight:
                    600;

        }


        .back-btn:hover {

            background:
                    #eff6ff;

        }


        /* ================= TABLE CARD ================= */

        .table-card {

            background:
                    white;

            border:
                    1px solid #e2e8f0;

            border-radius:
                    14px;

            overflow:
                    hidden;

            box-shadow:
                    0 4px 15px
                    rgba(0,0,0,0.05);

        }


        table {

            width:
                    100%;

            border-collapse:
                    collapse;

        }


        th {

            background:
                    #f8fafc;

            text-align:
                    left;

            padding:
                    18px;

            font-size:
                    14px;

            color:
                    #475569;

            border-bottom:
                    1px solid #e2e8f0;

        }


        td {

            padding:
                    18px;

            border-bottom:
                    1px solid #e2e8f0;

            font-size:
                    15px;

        }


        tr:last-child td {

            border-bottom:
                    none;

        }


        tr:hover {

            background:
                    #f8fafc;

        }


        /* ================= VIEW BUTTON ================= */

        .view-btn {

            background:
                    #2563eb;

            color:
                    white;

            border:
                    none;

            padding:
                    8px 16px;

            border-radius:
                    7px;

            cursor:
                    pointer;

            font-weight:
                    600;

        }


        .view-btn:hover {

            background:
                    #1d4ed8;

        }


        /* ================= FORM CARD ================= */

        #applicationFormCard {

            background:
                    white;

            margin-top:
                    35px;

            padding:
                    30px;

            border:
                    1px solid #e2e8f0;

            border-radius:
                    14px;

            box-shadow:
                    0 4px 15px
                    rgba(0,0,0,0.05);

        }


        #applicationFormCard h2 {

            margin-top:
                    0;

            margin-bottom:
                    25px;

            color:
                    #1e293b;

        }


        /* ================= FORM GRID ================= */

        .form-row {

            display:
                    grid;

            grid-template-columns:
                    1fr 1fr;

            gap:
                    25px;

            margin-bottom:
                    20px;

        }


        .form-group {

            display:
                    flex;

            flex-direction:
                    column;

        }


        .form-group.full-width {

            width:
                    100%;

            margin-bottom:
                    20px;

        }


        label {

            margin-bottom:
                    8px;

            font-weight:
                    600;

            color:
                    #334155;

            font-size:
                    14px;

        }


        input,
        select,
        textarea {

            width:
                    100%;

            padding:
                    12px;

            border:
                    1px solid #cbd5e1;

            border-radius:
                    8px;

            font-size:
                    15px;

            outline:
                    none;

            font-family:
                    inherit;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color:
                    #2563eb;

            box-shadow:
                    0 0 0 3px
                    rgba(37,99,235,0.1);

        }


        input[readonly] {

            background:
                    #f8fafc;

            color:
                    #475569;

        }


        textarea {

            min-height:
                    100px;

            resize:
                    vertical;

        }


        /* ================= REJECTION ================= */

        #rejectionReasonGroup {

            background:
                    #fff7ed;

            padding:
                    18px;

            border-radius:
                    10px;

            border:
                    1px solid #fed7aa;

            margin-bottom:
                    20px;

        }


        #rejectionReasonGroup label {

            color:
                    #9a3412;

        }


        /* ================= BUTTONS ================= */

        .form-buttons {

            display:
                    flex;

            gap:
                    12px;

            margin-top:
                    25px;

        }


        .update-btn {

            background:
                    #2563eb;

            color:
                    white;

            border:
                    none;

            padding:
                    12px 22px;

            border-radius:
                    8px;

            font-size:
                    15px;

            font-weight:
                    600;

            cursor:
                    pointer;

        }


        .update-btn:hover {

            background:
                    #1d4ed8;

        }


        .cancel-btn {

            background:
                    white;

            color:
                    #475569;

            border:
                    1px solid #cbd5e1;

            padding:
                    12px 22px;

            border-radius:
                    8px;

            font-size:
                    15px;

            font-weight:
                    600;

            cursor:
                    pointer;

        }


        .cancel-btn:hover {

            background:
                    #f1f5f9;

        }


        /* ================= RESPONSIVE ================= */

        @media
        (
        max-width: 700px
        ) {

            .page-header {

                flex-direction:
                        column;

                align-items:
                        flex-start;

                gap:
                        20px;

            }


            .form-row {

                grid-template-columns:
                        1fr;

            }


            .table-card {

                overflow-x:
                        auto;

            }

        }

    </style>

</head>


<body>


<div class="page-container">


    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <div>

            <h1>
                Application History
            </h1>

            <p>
                View and manage all application records.
            </p>

        </div>


        <button
                class="back-btn"
                onclick="
                window.location.href=
                'admin-applications.html'
                "
        >

            ← Back to Applications

        </button>

    </div>


    <!-- ================= TABLE ================= -->

    <div class="table-card">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Applicant</th>

                <th>Scheme</th>

                <th>Applied Date</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

            </thead>


            <tbody
                    id="historyBody"
            >

            </tbody>

        </table>

    </div>


    <!-- ================= UPDATE FORM ================= -->

    <div
            id="applicationFormCard"
            style="display: none;"
    >

        <h2>
            Update Application
        </h2>


        <form
                id="applicationForm"
        >


            <!-- ROW 1 -->

            <div class="form-row">


                <div class="form-group">

                    <label>
                        Applicant
                    </label>

                    <input
                            id="applicantName"
                            readonly
                    >

                </div>


                <div class="form-group">

                    <label>
                        Scheme
                    </label>

                    <input
                            id="schemeName"
                            readonly
                    >

                </div>


            </div>


            <!-- STATUS -->

            <div class="form-group full-width">

                <label>
                    Application Status
                </label>

                <select
                        id="applicationStatus"
                >

                    <option
                            value="SUBMITTED"
                    >
                        Submitted
                    </option>


                    <option
                            value="APPROVED"
                    >
                        Approved
                    </option>


                    <option
                            value="REJECTED"
                    >
                        Rejected
                    </option>

                </select>

            </div>


            <!-- REJECTION REASON -->

            <div
                    id="rejectionReasonGroup"
                    style="display: none;"
            >

                <label>
                    Rejection Reason
                </label>

                <textarea
                        id="rejectionReason"
                        placeholder="
                        Enter the reason for rejecting
                        this application
                        "
                ></textarea>

            </div>


            <!-- REMARKS -->

            <div class="form-group full-width">

                <label>
                    Remarks
                </label>

                <textarea
                        id="remarks"
                        placeholder="
                        Enter additional remarks
                        "
                ></textarea>

            </div>


            <!-- BUTTONS -->

            <div class="form-buttons">

                <button
                        type="submit"
                        class="update-btn"
                >

                    Update Application

                </button>


                <button
                        type="button"
                        class="cancel-btn"
                        id="cancelApplicationBtn"
                >

                    Cancel

                </button>

            </div>


        </form>

    </div>


</div>


<script
        src="js/application-history.js"
></script>


</body>

</html>
