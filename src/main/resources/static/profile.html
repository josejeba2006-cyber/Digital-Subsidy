<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Digital Subsidy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

<header class="navbar">

    <div class="logo">
        Digital<span>Subsidy</span>
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="schemes.html">Schemes</a>
        <a href="eligible-schemes.html">Eligible Schemes</a>
        <a href="my-applications.html">My Applications</a>

    </nav>


    <div class="profile-menu">

        <button class="profile-button" id="profileButton">

            <span class="user-icon">👤</span>

            <span id="navUserEmail">
            User
        </span>

            <span class="dropdown-arrow">
            ▼
        </span>

        </button>

        <div class="profile-dropdown" id="profileDropdown">

            <div class="dropdown-user">

                <div class="dropdown-avatar">
                    👤
                </div>

                <div>
                    <strong id="dropdownEmail">
                        User
                    </strong>

                    <small>
                        User
                    </small>
                </div>

            </div>

            <div class="dropdown-divider"></div>

            <a href="profile.html">
                👤 My Profile
            </a>

            <button id="logoutBtn">
                🚪 Logout
            </button>

        </div>

    </div>

</header>


<main class="profile-container">

    <div class="profile-header">

        <div class="profile-avatar">
            👤
        </div>

        <p class="hero-tag">YOUR PROFILE</p>

        <h1 id="profileName">My Profile</h1>

        <p id="profileEmail">
            Manage your personal details
        </p>

    </div>


    <div class="profile-card">

        <form id="profileForm">

            <div class="profile-grid">

                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                            type="text"
                            id="firstName"
                            placeholder="Enter first name"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                            type="text"
                            id="lastName"
                            placeholder="Enter last name"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required
                    >

                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="form-group">

                    <label for="emailId">
                        Email
                    </label>

                    <input
                            type="email"
                            id="emailId"
                            placeholder="Enter email"
                            required
                            readonly
                    >

                </div>


                <div class="form-group">

                    <label for="dateofbirth">
                        Date of Birth
                    </label>

                    <input
                            type="date"
                            id="dateofbirth"
                            required
                    >

                </div>
                <div class="form-group">
                    <label for="beneficiaryCategory">
                        Beneficiary Category
                    </label>

                    <select id="beneficiaryCategory">
                        <option value="">Select Category</option>
                        <option value="OC">OC</option>
                        <option value="BC">BC</option>
                        <option value="MBC">MBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                    </select>
                </div>



                <div class="form-group">

                    <label for="annualIncome">
                        Annual Income
                    </label>

                    <select id="annualIncome" required>
                        <option value="">Select Annual Income</option>
                        <option value="100000">Below ₹1,00,000</option>
                        <option value="200000">₹1,00,000 - ₹2,00,000</option>
                        <option value="300000">₹2,00,000 - ₹3,00,000</option>
                        <option value="400000">₹3,00,000 - ₹4,00,000</option>
                        <option value="500000">₹4,00,000 - ₹5,00,000</option>
                        <option value="700000">₹5,00,000 - ₹7,00,000</option>
                        <option value="1000000">Above ₹7,00,000</option>
                    </select>

                </div>
                <div class="form-group">

                    <label for="occupation">
                        Occupation
                    </label>

                    <select id="occupation" required>
                        <option value="">Select occupation</option>
                        <option value="Student">Student</option>
                        <option value="Employee">Employee</option>
                        <option value="Farmer">Farmer</option>
                        <option value="Entrepreneur">Entrepreneur</option>
                        <option value="Fisherman">Fisherman</option>
                        <option value="Worker">Worker</option>
                        <option value="Senior Citizen">Senior Citizen</option>
                        <option value="MINORITY">Minority</option>
                        <option value="DISABLED">Disabled</option>
                        <option value="Housewife">House Wife</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <select id="location" required>
                        <option value="">Select state</option>
                        <option>Andhra Pradesh</option>
                        <option>Arunachal Pradesh</option>
                        <option>Assam</option>
                        <option>Bihar</option>
                        <option>Chhattisgarh</option>
                        <option>Goa</option>
                        <option>Gujarat</option>
                        <option>Haryana</option>
                        <option>Himachal Pradesh</option>
                        <option>Jharkhand</option>
                        <option>Karnataka</option>
                        <option>Kerala</option>
                        <option>Madhya Pradesh</option>
                        <option>Maharashtra</option>
                        <option>Manipur</option>
                        <option>Meghalaya</option>
                        <option>Mizoram</option>
                        <option>Nagaland</option>
                        <option>Odisha</option>
                        <option>Punjab</option>
                        <option>Rajasthan</option>
                        <option>Sikkim</option>
                        <option>Tamil Nadu</option>
                        <option>Telangana</option>
                        <option>Tripura</option>
                        <option>Uttar Pradesh</option>
                        <option>Uttarakhand</option>
                        <option>West Bengal</option>
                    </select>

                </div>

            </div> <!-- profile-grid -->


            <div id="profileMessage"
                 class="message">
            </div>


            <div class="profile-actions"
                 style="text-align: center;">

                <button
                        type="submit"
                        class="auth-submit">
                    Save Details
                </button>

            </div>

        </form>

    </div> <!-- profile-card -->

</main>


<footer>

    <div class="footer-logo">
        Digital<span>Subsidy</span>
    </div>

    <p>
        Simple, transparent and accessible subsidy applications.
    </p>

    <div class="footer-line"></div>

    <small>
        © 2026 Digital Subsidy Platform. All rights reserved.
    </small>

</footer>


<script src="js/profile.js"></script>
<script src="js/navbar.js"></script>
</body>
</html>
